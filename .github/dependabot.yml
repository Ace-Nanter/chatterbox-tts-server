version: 2
updates:
  # Keep GitHub Actions pinned versions fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Server-layer Python dependencies (requirements.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image (nvidia/cuda) digest / tag bumps.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # A CUDA major bump changes the runtime and must be validated manually
      # against the torch build (cu124); never auto-bump majors.
      - dependency-name: "nvidia/cuda"
        update-types: ["version-update:semver-major"]
