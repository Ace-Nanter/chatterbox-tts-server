name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.event.repository.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare variables
        id: vars
        run: |
          # The registry host is a secret and never appears in the repository.
          # On pull_request the image is only built (never pushed), so tag it
          # locally without a registry prefix: an empty DOCKER_REGISTRY_HOST
          # would otherwise produce an invalid "/name:tag" reference.
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            IMAGE_ID="$IMAGE_NAME"
          else
            IMAGE_ID=$(echo "${{ secrets.DOCKER_REGISTRY_HOST }}/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          fi
          VERSION=$(echo "${GITHUB_REF}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${GITHUB_REF}" == refs/tags/* ]] && VERSION=$(echo "$VERSION" | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          [ "${{ github.event_name }}" == "pull_request" ] && VERSION=integration
          echo "image=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
            docker login ${{ secrets.DOCKER_REGISTRY_HOST }} \
              --username "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
