name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies (engine stubbed, no GPU needed)
        run: |
          pip install --quiet fastapi "uvicorn[standard]" python-multipart httpx pytest numpy soundfile requests

      - name: Unit tests
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    env:
      # The registry host is public (same setup as BunnyBot); only the
      # credentials are secrets. The README keeps a placeholder and never
      # mentions this host.
      DOCKER_REGISTRY_HOST: docker-registry.pandore.ovh
      # Deliberately hardcoded (not ${{ github.event.repository.name }}) so the
      # image name does not depend on repo-rename timing. The previous image
      # tag stays in the registry as a rollback path — never delete it.
      IMAGE_NAME: tts-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare variables
        id: vars
        run: |
          IMAGE_ID=$(echo "$DOCKER_REGISTRY_HOST/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          VERSION=$(echo "${GITHUB_REF}" | sed -e 's,.*/\(.*\),\1,')
          [[ "${GITHUB_REF}" == refs/tags/* ]] && VERSION=$(echo "$VERSION" | sed -e 's/^v//')
          [ "$VERSION" == "main" ] && VERSION=latest
          [ "${{ github.event_name }}" == "pull_request" ] && VERSION=integration
          echo "image=$IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | \
            docker login "$DOCKER_REGISTRY_HOST" \
              --username "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
